services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jivoetelo
      POSTGRES_USER: jivoetelo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Настройки под небольшой VPS (docs/shared-infra.md). Умолчания Postgres
    # рассчитаны на выделенный сервер: сотня соединений резервирует память,
    # которая нам не нужна — у приложения один пул на 10 соединений.
    command: >
      postgres
      -c max_connections=25
      -c shared_buffers=96MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=48MB
    mem_limit: 384m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jivoetelo -d jivoetelo"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Без лимита логи контейнера растут, пока не кончится диск на VPS.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jivoetelo:${POSTGRES_PASSWORD}@db:5432/jivoetelo
      UPLOADS_DIR: /app/data/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # Модель под каждую операцию отдельно (docs/ai-proxy.md). Умолчания
      # разумны, но без проброса переопределить их на сервере было нечем.
      ANTHROPIC_MODEL_VISION: ${ANTHROPIC_MODEL_VISION:-}
      ANTHROPIC_MODEL_TEXT: ${ANTHROPIC_MODEL_TEXT:-}
      ANTHROPIC_MODEL_SUGGEST: ${ANTHROPIC_MODEL_SUGGEST:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-}
      # Расшифровка голосовых (lib/speech). Пусто — бот честно отвечает
      # «не расшифровываю», кнопки записи нет, остальное работает как обычно.
      SPEECH_URL: ${SPEECH_URL:-}
      SPEECH_TOKEN: ${SPEECH_TOKEN:-}
      SPEECH_PROVIDER: ${SPEECH_PROVIDER:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Без него кнопки «Войти через Telegram» нет вовсе — а задавали её в
      # .env и не понимали, почему не появляется.
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_MINIAPP_URL: ${TELEGRAM_MINIAPP_URL:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-}
      TELEGRAM_API_AUTH: ${TELEGRAM_API_AUTH:-}
      SITE_URL: ${SITE_URL:-https://jivoetelo.ru}
      # Пусто — ключ генерируется случайно при старте; задавать нужно только
      # при нескольких экземплярах приложения.
      PHOTO_LINK_SECRET: ${PHOTO_LINK_SECRET:-}
      # Почтовая серия (docs/email-series.md). Без SMTP_* письма печатаются
      # в лог и никуда не уходят — так задумано для первого запуска.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-}
      # Приём оплаты. Рабочий провайдер — Tribute; Unitpay оставлен про запас
      # (docs/payments.md). PAYMENTS_ENABLED общий: он включает приём вообще.
      TRIBUTE_API_KEY: ${TRIBUTE_API_KEY:-}
      TRIBUTE_LINK_MONTH: ${TRIBUTE_LINK_MONTH:-}
      TRIBUTE_LINK_YEAR: ${TRIBUTE_LINK_YEAR:-}
      TRIBUTE_REF_SECRET: ${TRIBUTE_REF_SECRET:-}
      UNITPAY_PUBLIC_KEY: ${UNITPAY_PUBLIC_KEY:-}
      UNITPAY_SECRET_KEY: ${UNITPAY_SECRET_KEY:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      # Реквизиты оператора ПДн для юридических страниц (docs/legal.md).
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_OPERATOR_INN: ${LEGAL_OPERATOR_INN:-}
      LEGAL_OPERATOR_OGRN: ${LEGAL_OPERATOR_OGRN:-}
      LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      # Поставщик почты для таблицы получателей в политике. Заполнить до
      # того, как включатся отчёты: они несут сведения о питании и вес.
      LEGAL_MAIL_PROVIDER: ${LEGAL_MAIL_PROVIDER:-}
      LEGAL_MAIL_PROVIDER_COUNTRY: ${LEGAL_MAIL_PROVIDER_COUNTRY:-}
      # Без него /admin отвечает 404 всем без исключения.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Потолок кучи: при утечке или всплеске на разборе фото процесс упрётся
      # в свой лимит и перезапустится, а не утащит за собой базу.
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 512m
    volumes:
      - uploads:/app/data
    healthcheck:
      # Проверяем не порт, а /api/health: он отвечает 200 только когда
      # приложение действительно достучалось до базы.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Наружу порт не открываем: TLS и домен обслуживает reverse proxy на VPS
    # (см. docs/deploy-vps.md).
    ports:
      # Наружу порт не публикуется — только на localhost, где его забирает
      # reverse proxy. Номер вынесен в переменную: на сервере, где уже живёт
      # другое приложение, 3000 может быть занят, и тогда контейнер просто не
      # поднимется. Меняя порт здесь, поменяйте его и в конфиге nginx
      # (deploy/nginx/jivoetelo-proxy.conf).
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
