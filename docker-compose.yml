services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jivoetelo
      POSTGRES_USER: jivoetelo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jivoetelo -d jivoetelo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jivoetelo:${POSTGRES_PASSWORD}@db:5432/jivoetelo
    # Наружу порт не открываем: TLS и домен обслуживает reverse proxy на VPS
    # (см. docs/deploy-vps.md).
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
