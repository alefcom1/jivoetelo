name: Ночь ремонта

# Седьмая ночь недели. Не пишет ни одной новой страницы — приводит в порядок
# написанные за неделю.
#
# Почему она вообще нужна. Прежний план умел только добавлять, и через два
# месяца из него вышло бы шестьдесят страниц, каждая достижима одной ссылкой
# из хаба, с датами обновления, которые никто не трогал. Страница, на которую
# ведёт одна ссылка из списка, для поиска почти не существует, а даты,
# стоящие просто так, поиск быстро перестаёт учитывать. Ночь ремонта стоит
# одной шестой пропускной способности и окупается первым же кластером.
#
# Разбор целиком — `docs/seo-pipeline.md`, раздел «Ночь ремонта».
on:
  # Сб 21:00 UTC = вс 00:00 МСК. Содержательный конвейер в эту ночь не
  # запускается: у него расписание вс–пт (`content.yml`).
  schedule:
    - cron: "0 21 * * 6"
  workflow_dispatch:

concurrency:
  group: content-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Забрать код
        # Полная история: агенту нужно видеть, что слито за неделю, — по
        # мелкой копии этого не понять.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить доступ агента
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "::error::Не задан секрет CLAUDE_CODE_OAUTH_TOKEN — ремонтировать нечем."
            exit 1
          fi

      - name: Ветка под ремонт
        id: branch
        run: |
          BRANCH="content/$(date -u +%Y-%m-%d)-remont"
          git config user.name "Ночной конвейер"
          git config user.email "noreply@jivoetelo.ru"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Починить
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --permission-mode acceptEdits
          prompt: |
            Ты — агент ночи ремонта «Живого Тела». Новых страниц сегодня не
            пишешь вовсе: приводишь в порядок написанные.

            Прочитай `docs/seo-pipeline.md`, раздел «Ночь ремонта», и делай по
            нему, по убыванию цены:

            1. ПЕРЕЛИНКОВКА. Посмотри `git log --since="8 days ago"` и найди
               страницы, добавленные за неделю. Для каждой найди два-три
               места в существующих текстах, где ссылка на неё уместна ПО
               СМЫСЛУ, и поставь. Не блоком «читайте также» в конце — внутри
               абзаца, где о предмете и так идёт речь. Страница, на которую
               ведёт одна ссылка из хаба, для поиска почти не существует.

            2. ПОХОЖЕСТЬ. Сравни страницы недели между собой и с соседями по
               кластеру. Два текста, отвечающих на один и тот же запрос, —
               это не два входа, а один расколотый. Нашёл такие — не удаляй
               сам, опиши в итоге и предложи, что с чем слить.

            3. ЧИСЛА. Если источник изменился или поменялась методика —
               поправь и проставь новую дату обновления. Дату, которая стоит
               просто так, не трогай: поиск перестаёт верить страницам, у
               которых дата меняется без изменений текста.

            4. АУДИТ. Собери проект и прогони `node scripts/audit-site.mjs`
               на живой сборке (порядок запуска standalone-сервера и две
               ловушки при этом — `docs/handover.md`). Почини найденное.

            5. ОЧЕРЕДЬ. Вычеркни в `docs/seo-pipeline.md` то, что за неделю
               сделано и слито. Если по ходу недели появились темы — допиши
               их в очередь. Если какая-то позиция перестала иметь смысл —
               сними её и напиши почему.

            Отдельно: в `tests/content-quality.test.mjs` пороги стоят
            храповиком по сегодняшнему минимуму, и там же записан долг —
            тонкие карточки продуктов и низкая доля связанных с блюдами.
            Если время осталось, подними две-три самые бедные карточки и
            подтяни пороги в тесте до нового минимума.

            Закончив, прогони `npm test`, `npm run lint` и `npx tsc --noEmit`.
            Ничего не публикуй: работа уходит веткой на утреннюю проверку.

      - name: Отправить ветку
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "::warning::Чинить было нечего — ветку не отправляем."
            exit 0
          fi
          git add -A
          git commit -m "Ночь ремонта: перелинковка, числа и очередь"
          git push -u origin "${{ steps.branch.outputs.name }}"
