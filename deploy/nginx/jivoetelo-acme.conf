# Временный конфиг: нужен один раз, чтобы Let's Encrypt смог проверить домен
# до того, как появится сертификат. Полный конфиг с блоком 443 положить
# нельзя — nginx не запустится, пока файлов сертификата нет.
#
#   cp deploy/nginx/jivoetelo-acme.conf /etc/nginx/sites-available/jivoetelo.ru
#   ln -sf /etc/nginx/sites-available/jivoetelo.ru /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot certonly --webroot -w /var/www/html -d jivoetelo.ru -d www.jivoetelo.ru
#
# После выпуска сертификата заменить файл на deploy/nginx/jivoetelo.conf.

server {
    listen 80;
    listen [::]:80;
    server_name jivoetelo.ru www.jivoetelo.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}
