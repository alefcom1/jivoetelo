# Боевой конфиг nginx для jivoetelo.ru.
#
# Почему nginx, а не Caddy из deploy/Caddyfile: на этом же сервере nginx уже
# обслуживает techperevod.com с сертификатами от certbot. Два веб-сервера за
# один 80-й порт не помещаются, а выключать работающий сайт ради второго —
# плохая цена. Caddyfile оставлен для случая, когда сервер будет пустым.
#
#   cp deploy/nginx/jivoetelo*.conf /etc/nginx/snippets/     # два сниппета
#   cp deploy/nginx/jivoetelo.conf /etc/nginx/sites-available/jivoetelo.ru
#   ln -sf /etc/nginx/sites-available/jivoetelo.ru /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name jivoetelo.ru www.jivoetelo.ru;

    # Продление сертификата ходит по http — оставляем ему дорогу.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://jivoetelo.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jivoetelo.ru;

    ssl_certificate /etc/letsencrypt/live/jivoetelo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jivoetelo.ru/privkey.pem;

    return 301 https://jivoetelo.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jivoetelo.ru;

    ssl_certificate /etc/letsencrypt/live/jivoetelo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jivoetelo.ru/privkey.pem;

    # Фото еды уходят через server action; лимит согласован с bodySizeLimit
    # в next.config.ts (9 МБ) с запасом на служебные поля.
    client_max_body_size 12M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/jivoetelo-access.log;
    error_log /var/log/nginx/jivoetelo-error.log;

    # Mini App открывается внутри iframe Telegram — ему встраивание разрешено,
    # всему остальному сайту нет.
    location ^~ /tg {
        include snippets/jivoetelo-headers.conf;
        add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://telegram.org" always;
        include snippets/jivoetelo-proxy.conf;
    }

    # Шрифты и картинка для соцсетей неизменны и лежат в репозитории —
    # отдаём с длинным кэшем (Next для файлов из public/ этого не делает).
    location ~ ^/(fonts/|og\.jpg$|favicon\.svg$) {
        include snippets/jivoetelo-headers.conf;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        # add_header в nginx добавляет, а не заменяет: без proxy_hide_header
        # к ответу приезжают два Cache-Control — свой и присланный Next
        # (public, max-age=0). Браузер берёт первый, и длинный кэш не работает.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/jivoetelo-proxy.conf;
    }

    location / {
        include snippets/jivoetelo-headers.conf;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        include snippets/jivoetelo-proxy.conf;
    }
}
