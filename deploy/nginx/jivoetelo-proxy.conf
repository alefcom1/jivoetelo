# Общие параметры проксирования на приложение. Вынесены в отдельный файл,
# потому что подключаются в каждый location: nginx не наследует директивы
# внутрь location, если там объявлены свои.

proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Пустой Connection оставляет соединение с приложением живым между запросами.
proxy_set_header Connection "";

# Разбор фото ходит к модели через прокси в Германию и занимает секунды.
# Умолчание nginx — 60 с; на медленном ответе пользователь получил бы 504
# ровно в тот момент, когда всё почти получилось.
proxy_read_timeout 120s;
proxy_send_timeout 120s;
