# Общие параметры проксирования на приложение. Вынесены в отдельный файл,
# потому что подключаются в каждый location: nginx не наследует директивы
# внутрь location, если там объявлены свои.

# Порт должен совпадать с APP_HOST_PORT из .env (по умолчанию 3000).
proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Пустой Connection оставляет соединение с приложением живым между запросами.
proxy_set_header Connection "";

# Разбор фото ходит к модели через прокси в Германию: модель со зрением
# думает, и минута для неё — норма. Умолчание nginx (60 с) обрывало бы такой
# ответ ровно в тот момент, когда всё почти получилось.
#
# Это число обязано быть БОЛЬШЕ худшего случая приложения (worstCaseMs в
# lib/ai/client.ts). Здесь уже стояло ровно столько же, сколько ждало
# приложение, — и nginx обрывал соединение в момент повторной попытки, молча,
# пятьсот четвёртой, без единой строки в нашем логе. Разбор текста этого не
# замечал: haiku отвечает за секунды.
#
# Расхождение проверяется тестом (tests/ai-budget.test.mjs): увидеть его
# глазами в двух разных файлах не получилось ни разу.
proxy_read_timeout 180s;
proxy_send_timeout 180s;
