# Заголовки безопасности. Тоже подключаются в каждый location: одна
# директива add_header внутри location отменяет все унаследованные, и про эту
# особенность nginx забывают чаще всего.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Камера нужна для съёмки еды с телефона, остальное запрещаем.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;
